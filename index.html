<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Diccionario interactivo de patrones chartistas con gráficos de velas, y un playground para detectar patrones en tus propios datos OHLC."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Trandio — Patrones chartistas</title>
    <script>
      (function () {
        var light = false;
        try {
          light = localStorage.getItem("trandio-theme") === "light";
        } catch (e) {}
        if (light) document.documentElement.dataset.theme = "light";
        document.documentElement.style.background = light ? "#fbfbfa" : "#0a0a0a";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && light) meta.setAttribute("content", "#fbfbfa");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Trandio",
        "url": "https://trandio.app/",
        "description": "Diccionario interactivo de patrones chartistas con gráficos de velas y un playground para detectar patrones en datos OHLC propios.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "image": "https://trandio.app/og.png"
      }
    </script>
    <script>
      (function () {
        if (location.pathname !== "/") {
          history.replaceState(null, "", "/" + location.search + location.hash);
        }
        var light = false;
        try {
          light = localStorage.getItem("trandio-theme") === "light";
        } catch (e) {}
        if (light) document.documentElement.dataset.theme = "light";
        document.documentElement.style.background = light ? "#fbfbfa" : "#0a0a0a";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && light) meta.setAttribute("content", "#fbfbfa");
      })();
    </script>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
